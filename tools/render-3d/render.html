let camera, composer;

if (sceneName === 'hero') {

  scene.fog = new THREE.FogExp2(0x160d0d, 0.0105);

  camera.position.set(0, 6, 70); camera.lookAt(0, 12, -100);

  const skyC = document.createElement('canvas'); skyC.width = 4; skyC.height = 512; const sg = skyC.getContext('2d');
  const grd = sg.createLinearGradient(0, 0, 0, 512); if (R) { grd.addColorStop(0, '#7fa9c2'); grd.addColorStop(0.55, '#c9dde2'); grd.addColorStop(1, '#f3efe2'); } else { grd.addColorStop(0, '#050506'); grd.addColorStop(0.55, '#140c0c'); grd.addColorStop(1, '#2a1110'); }

  const skyT = new THREE.CanvasTexture(skyC); skyT.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(900, 300), new THREE.MeshBasicMaterial({ map: skyT, fog: false }));
  sky.position.set(0, 60, -260); scene.add(sky);
  // moon

  moon.position.set(30, 26, -230); scene.add(moon);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: (R ? glowTexture('rgba(255,244,214,0.75)', 'rgba(255,226,160,0.25)') : glowTexture('rgba(230,60,45,0.5)', 'rgba(150,25,20,0.2)')), blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  halo.scale.set(220, 220, 1); halo.position.copy(moon.position); halo.position.z += 1; scene.add(halo);

    { z: -200, h: 70, c: '#9db7bf', sx: 0.010, seed: 3, base: -10 },
    { z: -160, h: 58, c: '#7d9ca3', sx: 0.014, seed: 9, base: -14 },
    { z: -120, h: 44, c: '#5a7d80', sx: 0.020, seed: 21, base: -16 },
    { z: -80, h: 32, c: '#3c5b5a', sx: 0.028, seed: 33, base: -18 },

    { z: -120, h: 44, c: '#1c0d0c', sx: 0.020, seed: 21, base: -16 },

// ---- Lesser Gu: one creature/object per project, tinted by its rank essence ----

  }
  return head;
}

// Heaven's Eye — a silver eye-moth inside red detection brackets (traffic vision)
if (sceneName === 'eye') {
  iconLights(BLOOD, JADE); iconCam([0, 2.2, 10.4], [0, -0.15, 0]); pedestal(-1.75, 1.5);
  const G = new THREE.Group(); G.position.y = 0.25; scene.add(G);

  [[1.25, 0.45, 1.35, 0.5, 0.38], [0.95, -0.42, 0.95, 0.34, -0.32]].forEach(([x, y, sx, sy, rz]) => [-1, 1].forEach((s) => {

// Gold-Sniffing — a silver beetle with a long snout, nosing a gold ring and nuggets
if (sceneName === 'sniffer') {
  iconLights(BLOOD, 0xffd27a); iconCam([1.2, 2.6, 8.8], [0.2, -0.55, 0]); pedestal(-1.75, 1.9);
  const S = essence(R3, { metalness: 0.95, roughness: 0.18 }), dark = new THREE.MeshPhysicalMaterial({ color: 0x0c0c0d, roughness: 0.05, clearcoat: 1 });
  const B = new THREE.Group(); B.position.set(-0.95, -1.12, 0); B.rotation.y = -0.4; B.scale.setScalar(0.9); scene.add(B);
  const ab = add(new THREE.SphereGeometry(0.85, 64, 40), S, [-0.45, 0.48, 0], B); ab.scale.set(1.35, 0.72, 0.95);
  const a = 0.85 * 1.35;
  [-0.55, 0, 0.5].forEach((dx) => {
    const k = Math.sqrt(1 - (dx / a) ** 2); const ring = add(new THREE.TorusGeometry(1.02, 0.035, 12, 64), goldM(), [-0.45 + dx, 0.48, 0], B);
    ring.rotation.y = Math.PI / 2; ring.scale.set(0.85 * 0.95 * k, 0.85 * 0.72 * k, 1);
  });
  add(new THREE.SphereGeometry(0.4, 48, 32), S, [0.78, 0.5, 0], B);
  const head = add(new THREE.SphereGeometry(0.32, 48, 32), S, [1.18, 0.44, 0], B); head.scale.set(1.1, 0.95, 1);
  const snout = add(new THREE.ConeGeometry(0.12, 0.85, 24), S, [1.72, 0.22, 0], B); snout.rotation.z = -Math.PI / 2 - 0.45;
  add(new THREE.SphereGeometry(0.055, 16, 16), glowM(0xffd27a, 2.2), [2.1, 0.03, 0], B);
  [-1, 1].forEach((s) => {
    add(new THREE.SphereGeometry(0.075, 16, 16), dark, [1.32, 0.58, 0.22 * s], B);
    const c = new THREE.CatmullRomCurve3([new THREE.Vector3(1.2, 0.7, 0.12 * s), new THREE.Vector3(1.45, 1.2, 0.35 * s), new THREE.Vector3(1.85, 1.35, 0.55 * s)]);
    add(new THREE.TubeGeometry(c, 24, 0.018, 8), goldM(), [0, 0, 0], B);
    [0.35, 0.75, 1.05].forEach((x, i) => {
      const hip = [x - 0.2 * (1 - i), 0.32, 0.28 * s], knee = [x + 0.05 - 0.3 * (1 - i), 0.42, 0.78 * s], foot = [x + 0.15 - 0.5 * (1 - i), -0.5, 1.05 * s];
      limb(hip, knee, 0.045, S, B); limb(knee, foot, 0.034, S, B);
    });
  });
  // the loot
  const G = new THREE.Group(); G.position.set(1.15, -1.575, 0.35); scene.add(G);
  const ring = add(new THREE.TorusGeometry(0.3, 0.075, 24, 64), goldM(), [0, 0.375, 0], G); ring.rotation.y = 0.7;
  const gem = add(new THREE.OctahedronGeometry(0.13, 0), new THREE.MeshPhysicalMaterial({ color: BLOOD, emissive: BLOOD, emissiveIntensity: 0.5, roughness: 0.05, clearcoat: 1, flatShading: true }), [0, 0.8, 0], G); gem.scale.y = 1.3;
  [[0.55, 0.08, 0.35, 0.1], [-0.35, 0.07, 0.6, 0.085], [0.5, 0.09, -0.4, 0.12]].forEach(([x, y, z, r]) => { const n = add(new THREE.IcosahedronGeometry(r, 0), goldM(), [x, y, z], G); n.rotation.set(x, z, y); });

// Truth-Seeking — a red-steel balance: evidence scrolls weighed against a jade pearl of truth
if (sceneName === 'scale') {
  iconLights(BLOOD, JADE); iconCam([0, 1.8, 9], [0, -0.2, 0]); pedestal(-1.9, 1.5);
  const steel = essence(R2, { metalness: 0.85, roughness: 0.28 }), gold = goldM();
  add(new THREE.CylinderGeometry(0.4, 0.55, 0.22, 48), steel, [0, -1.62, 0]);
  add(new THREE.CylinderGeometry(0.06, 0.09, 2.7, 24), steel, [0, -0.2, 0]);
  add(new THREE.BoxGeometry(3.1, 0.08, 0.08), steel, [0, 1.12, 0]);
  add(new THREE.SphereGeometry(0.13, 32, 24), gold, [0, 1.12, 0]);
  const fin = add(new THREE.OctahedronGeometry(0.2, 0), new THREE.MeshPhysicalMaterial({ color: R2, emissive: R2, emissiveIntensity: 0.35, roughness: 0.06, clearcoat: 1, flatShading: true }), [0, 1.48, 0]); fin.scale.y = 1.6;

    const bowl = add(new THREE.SphereGeometry(0.58, 48, 24, 0, Math.PI * 2, Math.PI * 0.62, Math.PI * 0.38), new THREE.MeshPhysicalMaterial({ color: R2, metalness: 0.85, roughness: 0.28, clearcoat: 1, side: THREE.DoubleSide }), [x, panY + 0.45, 0]);
    const rim = add(new THREE.TorusGeometry(0.535, 0.022, 12, 64), gold, [x, panY + 0.02, 0]); rim.rotation.x = Math.PI / 2;
    if (s < 0) {
      const paper = new THREE.MeshStandardMaterial({ color: BONE, roughness: 0.7 });
      [[-0.12, 0.0, 0.08, 0.3], [0.13, 0.0, -0.06, -0.5], [0.0, 0.11, 0.0, 1.2]].forEach(([dx, dy, dz, ry]) => {
        const sc = add(new THREE.CylinderGeometry(0.075, 0.075, 0.48, 24), paper, [x + dx, panY + 0.02 + dy, dz]); sc.rotation.set(0, ry, Math.PI / 2);

      });

      add(new THREE.SphereGeometry(0.2, 48, 32), new THREE.MeshPhysicalMaterial({ color: JADE, emissive: JADE, emissiveIntensity: 0.9, roughness: 0.05, clearcoat: 1, iridescence: 0.6 }), [x, panY + 0.12, 0]);
      const g = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(170,255,220,0.8)', 'rgba(95,211,160,0.3)'), blending: THREE.AdditiveBlending, depthWrite: false })); g.scale.set(1.1, 1.1, 1); g.position.set(x, panY + 0.15, 0.2); scene.add(g);

// Silent Link — red-steel beacons joined into a mesh, one jade node sending signal arcs
if (sceneName === 'mesh') {
  iconLights(BLOOD, JADE); iconCam([0, 2.4, 8.8], [0, -0.1, 0]); pedestal(-1.8, 1.55);
  const G = new THREE.Group(); G.position.y = -0.05; G.rotation.set(0.12, 0.3, 0); scene.add(G);
  const steel = essence(R2, { metalness: 0.85, roughness: 0.22 }), gold = goldM();
  add(new THREE.IcosahedronGeometry(0.42, 1), new THREE.MeshPhysicalMaterial({ color: R2, metalness: 0.8, roughness: 0.2, clearcoat: 1, flatShading: true, emissive: R2, emissiveIntensity: 0.12 }), [0, 0, 0], G);
  const nodes = []; const n = 6;
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; nodes.push([Math.cos(a) * 1.45, Math.sin(i * 1.7) * 0.5, Math.sin(a) * 1.45]); }
  nodes.push([0.15, 1.3, 0.2]);
  nodes.forEach((p, i) => {
    add(new THREE.SphereGeometry(i === 1 ? 0.2 : 0.15, 32, 24), i === 1 ? new THREE.MeshPhysicalMaterial({ color: JADE, emissive: JADE, emissiveIntensity: 1, roughness: 0.1, clearcoat: 1 }) : steel, p, G);
    limb([0, 0, 0], p, 0.016, gold, G);
    if (i < n) limb(p, nodes[(i + 1) % n], 0.012, gold, G);
  });
  // signal arcs from the jade node, facing outward
  const J = new THREE.Vector3(...nodes[1]); const out = J.clone().setY(0).normalize();
  [0.35, 0.55, 0.75].forEach((r, k) => {
    const arc = add(new THREE.TorusGeometry(r, 0.018, 8, 48, Math.PI * 0.55), new THREE.MeshStandardMaterial({ color: JADE, emissive: JADE, emissiveIntensity: 1.6 - k * 0.4, transparent: true, opacity: 1 - k * 0.25 }), [J.x, J.y, J.z], G);
    arc.rotation.set(0, -Math.atan2(out.z, out.x), -Math.PI * 0.275); arc.castShadow = false;
  });
  // faint pulse rings on the ground plane of the mesh
  [0.75, 1.1].forEach((r, k) => { const ring = add(new THREE.TorusGeometry(r, 0.01, 8, 128), new THREE.MeshStandardMaterial({ color: R2, emissive: R2, emissiveIntensity: 1.2, transparent: true, opacity: 0.55 - k * 0.2 }), [0, 0, 0], G); ring.rotation.x = Math.PI / 2; ring.castShadow = false; });
  haloAt(R2, 6.5, 0.2);
}

// Bookworm — a green-copper worm (in spectacles) burrowing out of a stack of novels
if (sceneName === 'bookworm') {
  iconLights(BLOOD, JADE); iconCam([0, 2.5, 8.8], [0, -0.35, 0]); pedestal(-1.75, 1.75);
  const pages = new THREE.MeshStandardMaterial({ color: BONE, roughness: 0.8 });
  let y = -1.575; let top;
  [[0x2a2f2c, 0.36, 0.08], [0x6a2a24, 0.32, -0.12], [0x2f4f3f, 0.34, 0.1]].forEach(([c, h, ry]) => {
    const b = new THREE.Group(); b.position.y = y + h / 2; b.rotation.y = ry; scene.add(b);
    add(new RoundedBoxGeometry(2.1, h, 1.5, 3, 0.04), new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.55, clearcoat: 0.3 }), [0, 0, 0], b);
    add(new THREE.BoxGeometry(1.96, h * 0.78, 1.44), pages, [0.08, 0, 0.05], b);
    add(new THREE.BoxGeometry(0.06, h * 0.86, 1.52), goldM(), [-0.95, 0, 0], b);
    y += h; top = y;
  });
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.3, 48), new THREE.MeshBasicMaterial({ color: 0x050505 })); hole.rotation.x = -Math.PI / 2; hole.position.set(0.15, top + 0.003, 0.1); scene.add(hole);
  const curve = new THREE.CatmullRomCurve3([[0.15, top - 0.2, 0.1], [0.12, top + 0.55, 0.05], [0.32, top + 1.25, 0.3], [0.8, top + 1.38, 0.75], [0.95, top + 1.08, 1.35]].map((p) => new THREE.Vector3(...p)));
  const h = wormBody(curve, 22, 0.27, essence(R1, { metalness: 0.75, roughness: 0.28 }), goldM());
  const side = new THREE.Vector3().crossVectors(h.tan, new THREE.Vector3(0, 1, 0)).normalize();
  const eyeM = glowM(0xffe2a0, 2.2), rimM = goldM();
  [-1, 1].forEach((s) => {
    const e = h.p.clone().add(side.clone().multiplyScalar(0.12 * s)).add(new THREE.Vector3(0, 0.1, 0)).add(h.tan.clone().multiplyScalar(0.25));
    add(new THREE.SphereGeometry(0.045, 16, 16), eyeM, [e.x, e.y, e.z]);
    const lens = add(new THREE.TorusGeometry(0.085, 0.012, 8, 32), rimM, [0, 0, 0]); lens.position.copy(e.clone().add(h.tan.clone().multiplyScalar(0.05))); lens.lookAt(lens.position.clone().add(h.tan));
  });
  haloAt(R1, 6.5, 0.1);
}

// Elimination — an upper-triangular staircase of copper blocks; the eliminated cells dissolve upward
if (sceneName === 'elimination') {
  iconLights(BLOOD, JADE); iconCam([0, 3.4, 8.4], [0, -0.55, 0]); pedestal(-1.75, 1.75);
  const G = new THREE.Group(); G.position.y = -1.575; G.rotation.y = -0.62; scene.add(G);
  const cu = essence(R1, { metalness: 0.75, roughness: 0.3 }), piv = new THREE.MeshPhysicalMaterial({ color: GOLD, metalness: 1, roughness: 0.2, clearcoat: 1, emissive: 0x6a4410, emissiveIntensity: 0.8 });
  const s = 0.5, gap = 0.07, n = 4, off = ((n - 1) * (s + gap)) / 2;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = j * (s + gap) - off, z = i * (s + gap) - off;
    if (j >= i) {
      const levels = j - i + 1;
      for (let k = 0; k < levels; k++) add(new RoundedBoxGeometry(s, s, s, 3, 0.04), j === i && k === levels - 1 ? piv : cu, [x, s / 2 + k * (s + 0.02), z], G);
    } else {
      // dissolving shards where a value was eliminated to zero
      const ghost = new THREE.MeshPhysicalMaterial({ color: R1, metalness: 0.6, roughness: 0.3, transparent: true, opacity: 0.45, emissive: R1, emissiveIntensity: 0.3 });
      [[0, 0.12, 0, 0.22], [0.08, 0.55, -0.05, 0.14], [-0.06, 0.95, 0.05, 0.08]].forEach(([dx, yy, dz, sz], q) => { const m = add(new THREE.BoxGeometry(sz, sz, sz), ghost, [x + dx, yy + (i - j) * 0.08, z + dz], G); m.rotation.set(q + i, q * 0.7 + j, 0.4 * q); m.castShadow = false; });
    }
  }
  haloAt(R1, 6.5, 0);
}

function draw() { if (composer) composer.render(); else renderer.render(scene, camera); }
draw(); setTimeout(() => { draw(); window.__done = true; }, 300);
